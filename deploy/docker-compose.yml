# scentic-agpl-services — Local Development Docker Compose
# For local development only. Not for production.
# Production deployment: see docs/DEPLOYMENT.md

version: "3.8"

services:
  # ── Gateway ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    ports:
      - "3101:3101"
    environment:
      - NODE_ENV=development
      - GATEWAY_PORT=3101
      - SCENTIC_SERVICE_TOKEN=${SCENTIC_SERVICE_TOKEN:-dev-token}
      - GATEWAY_WEBHOOK_SECRET=${GATEWAY_WEBHOOK_SECRET:-dev-webhook-secret}
      - SCENTIC_CORE_URL=${SCENTIC_CORE_URL:-http://host.docker.internal:3100}
      - KIMAI_API_BASE_URL=http://kimai:80
      - OPENSIGN_SERVER_URL=http://opensign-server:8080/app
      - OPENSIGN_APP_ID=${OPENSIGN_APP_ID:-opensign-dev}
      - OPENSIGN_MASTER_KEY=${OPENSIGN_MASTER_KEY:-dev-master-key}
    depends_on:
      - kimai
      - opensign-server
    networks:
      - agpl-internal

  # ── Kimai ──────────────────────────────────────────────────────────────
  kimai-db:
    image: mariadb:10.11
    environment:
      - MYSQL_DATABASE=kimai
      - MYSQL_USER=kimai
      - MYSQL_PASSWORD=kimai_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - kimai-db-data:/var/lib/mysql
    networks:
      - agpl-internal

  kimai:
    image: kimai/kimai2:apache
    ports:
      - "8001:80"
    environment:
      - DATABASE_URL=mysql://kimai:kimai_password@kimai-db:3306/kimai?charset=utf8mb4&serverVersion=10.11.4-MariaDB
      - APP_ENV=prod
      - APP_SECRET=${KIMAI_APP_SECRET:-dev-secret}
      - MAILER_FROM=kimai@scentic-test.com
      - MAILER_URL=null://null
      - CORS_ALLOW_ORIGIN=.*
    depends_on:
      - kimai-db
    networks:
      - agpl-internal

  # ── OpenSign ───────────────────────────────────────────────────────────
  opensign-mongo:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - opensign-mongo-data:/data/db
    networks:
      - agpl-internal

  opensign-server:
    image: opensign/opensignserver:main
    ports:
      - "8080:8080"
    environment:
      - APP_ID=${OPENSIGN_APP_ID:-opensign-dev}
      - MASTER_KEY=${OPENSIGN_MASTER_KEY:-dev-master-key}
      - MONGODB_URI=mongodb://opensign-mongo:27017/opensign
      - SERVER_URL=http://localhost:8080/app
      - PARSE_MOUNT=/app
      - USE_LOCAL=TRUE
      - PFX_BASE64=${OPENSIGN_PFX_BASE64:-}
      - PASS_PHRASE=${OPENSIGN_PASS_PHRASE:-}
      # Email (configure for real testing)
      # - MAILGUN_API_KEY=
      # - MAILGUN_DOMAIN=
      # - MAILGUN_SENDER=
    depends_on:
      - opensign-mongo
    networks:
      - agpl-internal

  opensign-frontend:
    image: opensign/opensign:main
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_SERVERURL=http://localhost:8080/api/app
      - REACT_APP_APPID=${OPENSIGN_APP_ID:-opensign-dev}
    depends_on:
      - opensign-server
    networks:
      - agpl-internal

networks:
  agpl-internal:
    driver: bridge

volumes:
  kimai-db-data:
  opensign-mongo-data:
